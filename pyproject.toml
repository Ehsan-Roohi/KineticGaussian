[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetic-gaussian"
version = "0.1.0.dev0"
description = "Positive compact Gaussian representations of rarefied shock distributions"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Ehsan Roohi"},
]
dependencies = [
  "matplotlib>=3.6",
  "numpy>=1.23",
  "torch>=2.0",
  "tqdm>=4.60",
]

[project.urls]
Repository = "https://github.com/Ehsan-Roohi/KineticGaussian"

[tool.setuptools.packages.find]
include = ["kgfr*"]
